<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liam's Games</title>
    <link rel="stylesheet" href="/games/styles.css?v=1">
</head>
<body>
    <div class="page">
        <h1>Liam's Games</h1>
        <p>Pick a game.</p>
        <div class="list">
            <a class="card" href="/">
                <span class="pic mscape"></span>
                <span class="title">The Great MScape</span>
                <span class="look">Run, jump, and escape the Skittles</span>
            </a>
            <a class="card" href="/home">
                <span class="pic marble"></span>
                <span class="title">Skittle Marble Run</span>
                <span class="look">Roll on twisty tracks and the grass</span>
            </a>
            <a class="card" href="/map">
                <span class="pic city"></span>
                <span class="title">Home World</span>
                <span class="look">Walk the city and grab gems</span>
            </a>
            <a class="card" href="/food-fight">
                <span class="pic fight"></span>
                <span class="title">Hershey Super Power</span>
                <span class="look">Snack fights with Coke, Pepsi, Hershey, and Mars</span>
            </a>
            <a class="card" href="/math">
                <span class="pic math"></span>
                <span class="title">Math Rush</span>
                <span class="look">Beat the clock. The questions pick themselves</span>
            </a>
        </div>
    </div>
</body>
</html>
