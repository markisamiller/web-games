<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Map</title>
    <link rel="stylesheet" href="/map/styles.css?v=1">
</head>
<body>
    <div class="map-wrap">
        <div class="map">
            <h1>Game Map</h1>
            <p class="hint">Click a place to play.</p>

            <div class="land">
                <div class="path"></div>

                <a class="spot mscape" href="/">
                    <span class="icon">m</span>
                    <span class="name">The Great Mscape</span>
                    <span class="blurb">Jump and run</span>
                </a>

                <a class="spot fight" href="/food-fight">
                    <span class="icon">♥</span>
                    <span class="name">Hershey Super Power</span>
                    <span class="blurb">Snack fight</span>
                </a>
            </div>
        </div>
    </div>
    <script>
        function fitMap() {
            const wrap = document.querySelector('.map-wrap');
            const scale = Math.min(
                (window.innerWidth - 24) / 1000,
                (window.innerHeight - 24) / 560,
                1
            );
            wrap.style.transform = `scale(${scale})`;
        }
        fitMap();
        window.addEventListener('resize', fitMap);
    </script>
</body>
</html>
