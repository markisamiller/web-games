<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home World</title>
    <link rel="stylesheet" href="/map/styles.css?v=fp1">
</head>
<body>
    <div class="game-wrap">
        <div id="game">
            <div id="view"></div>
            <div id="hud">
                <span id="score">Stars: 0 / 8</span>
                <span id="hint">W A S D move, Space jump. You see out of your head.</span>
            </div>
            <div id="door-label" hidden></div>
            <div id="start-screen" class="panel">
                <h1>Home World</h1>
                <p>A new 3D game. You see out of your head.</p>
                <p>Walk, jump, and grab stars.</p>
                <p>Walk into a glowing door to play another game.</p>
                <button id="play-btn" type="button">Play</button>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="/map/script.js?v=fp1"></script>
</body>
</html>
